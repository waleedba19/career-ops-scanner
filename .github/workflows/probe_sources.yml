name: Probe Sources

# Answers "which candidate job sources actually work from the GitHub runner?"
# Results: job summary + artifact (output/source_probe.md / .json).
# Run manually, or weekly so dead/blocked sources are caught early.

on:
  workflow_dispatch:
    inputs:
      groups:
        description: "Space-separated groups to probe (empty = all). e.g. aggregator-keyed linkedin ats-language-ai"
        required: false
        default: ""
      only:
        description: "Comma-separated candidate ids (overrides groups)"
        required: false
        default: ""
  schedule:
    - cron: "30 3 * * 1"   # Mondays 03:30 UTC — before the 05:00 scan

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Optional keyed aggregators — probe reports `needs_key` until these exist
      RAPIDAPI_KEY:      ${{ secrets.RAPIDAPI_KEY }}
      ADZUNA_APP_ID:     ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY:    ${{ secrets.ADZUNA_APP_KEY }}
      JOOBLE_API_KEY:    ${{ secrets.JOOBLE_API_KEY }}
      CAREERJET_AFFID:   ${{ secrets.CAREERJET_AFFID }}
      RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
      REED_API_KEY:      ${{ secrets.REED_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install "aiohttp>=3.9,<4"

      - name: Probe
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.only }}" ]; then
            ARGS="--only ${{ github.event.inputs.only }}"
          elif [ -n "${{ github.event.inputs.groups }}" ]; then
            for g in ${{ github.event.inputs.groups }}; do ARGS="$ARGS --group $g"; done
          fi
          python probe_sources.py $ARGS --concurrency 6 --timeout 15

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-probe-${{ github.run_number }}
          path: |
            output/source_probe.md
            output/source_probe.json
          retention-days: 30
