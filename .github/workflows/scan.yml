name: CareerOps Job Scan

on:
  schedule:
    - cron: '0 7 * * *'      # 07:00 UTC = 09:00 Libya — Morning Digest (comprehensive)
    - cron: '0 16 * * *'     # 16:00 UTC = 18:00 Libya — Evening Digest (deep)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode (quick/standard/deep/comprehensive/adaptive)'
        required: false
        default: 'adaptive'
        type: choice
        options:
          - quick
          - standard
          - deep
          - comprehensive
          - adaptive
  push:
    branches: [main]
    paths-ignore: ['README.md', 'ARCHITECTURE.md', 'dashboard/**']

concurrency:
  group: careerops-scan-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours for comprehensive scans
    permissions:
      contents: write

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      BREVO_API_KEY:      ${{ secrets.BREVO_API_KEY }}
      TO_EMAIL:           ${{ secrets.TO_EMAIL }}
      GMAIL_USER:         ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
      # Optional keyed aggregators (each fetcher is a no-op while its secret is unset).
      RAPIDAPI_KEY:       ${{ secrets.RAPIDAPI_KEY }}
      ADZUNA_APP_ID:      ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY:     ${{ secrets.ADZUNA_APP_KEY }}
      JOOBLE_API_KEY:     ${{ secrets.JOOBLE_API_KEY }}
      RELIEFWEB_APPNAME:  ${{ secrets.RELIEFWEB_APPNAME }}
      CAREEROPS_TIER_CAP: "3"   # full worldwide sweep (all registry tiers)
      CAREEROPS_BATCH_SIZE: "12"
      CAREEROPS_MIN_SCORE: "50" # balanced threshold — 50-74 GOOD, 75+ STRONG
      CAREEROPS_COMPANY_MIN_SCORE: "40"  # trusted translation/AI companies
      CAREEROPS_FRESH_H: "48"   # jobs posted within 2 days count as fresh
      CAREEROPS_AI_CAP: "10"    # top N jobs get Groq analysis
      CAREEROPS_DEDUP_TTL_DAYS: "14"  # re-evaluate seen jobs after 14 days
      CAREEROPS_EMAIL_FINDER: "1"      # resolve employer inboxes (not board relay)
      CAREEROPS_EMAIL_TARGETS: "10"    # top N matches to enrich
      SCAN_MODE:          ${{ github.event.inputs.mode || 'adaptive' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore persistent state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python state_sync.py download

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache pip & Playwright browsers (no re-download)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: careerops-deps-v1-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Lint — compile check (fail fast)
        run: python -m compileall -q .

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium || echo "Playwright install failed, continuing"

      - name: Probe ATS company boards (kill 404s)
        run: python company_board_probe.py
        continue-on-error: true

      - name: Install Cloudflare WARP VPN
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/install.sh | sudo bash 2>/dev/null || echo "WARP install failed — using direct IP"
          sudo warp-cli registration new 2>/dev/null || true
          sudo warp-cli mode proxy 2>/dev/null || true
          sudo warp-cli connect 2>/dev/null || echo "WARP connect failed — using direct IP"
          sleep 3
          # Test if proxy works
          if curl -s --proxy socks5://127.0.0.1:40000 --max-time 5 https://api.ipify.org 2>/dev/null; then
            echo "WARP proxy active"
            echo "WARP_PROXY=socks5://127.0.0.1:40000" >> "$GITHUB_ENV"
          else
            echo "WARP proxy not available — using direct IP"
            echo "WARP_PROXY=" >> "$GITHUB_ENV"
          fi

      - name: Run job scanner (adaptive mode)
        run: python scanner.py --mode ${{ env.SCAN_MODE }}
        env:
          HTTPS_PROXY: ${{ env.WARP_PROXY }}
          HTTP_PROXY: ${{ env.WARP_PROXY }}
          ALL_PROXY: ${{ env.WARP_PROXY }}

      - name: Export metrics & health
        if: always()
        run: |
          echo "=== health.json ==="; cat output/health.json 2>/dev/null || echo "no health"
          echo "=== metrics.json ==="; cat output/metrics.json 2>/dev/null | head -n 80 || echo "no metrics"

      - name: Save persistent state
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python state_sync.py upload

      - name: Notify failure on Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}", "text": "⚠️ CareerOps scan FAILED. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' || true

      - name: Notify scan results on Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Read the scan result JSON if it exists
          if [ -f output/health.json ]; then
            MATCHES=$(python -c "import json; d=json.load(open('output/health.json')); print(d.get('total_matches', 0))")
            ERRORS=$(python -c "import json; d=json.load(open('output/health.json')); print(d.get('total_errors', 0))")
            if [ "$ERRORS" -gt 0 ]; then
              curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                -H "Content-Type: application/json" \
                -d "{\"chat_id\": \"$TELEGRAM_CHAT_ID\", \"text\": \"Warning: CareerOps scan had $ERRORS errors. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
            fi
          fi

      - name: Upload Excel report + dashboard snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: careerops-scan-${{ github.run_id }}
          path: |
            output/*.xls
            output/*.json
            output/health.json
            output/metrics.json
          retention-days: 30

      - name: Upload dashboard as Pages artifact (optional)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: careerops-dashboard-${{ github.run_id }}
          path: dashboard/
          retention-days: 7
