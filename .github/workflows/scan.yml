name: CareerOps Job Scan

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 07:00 Libya — Morning Intel
    - cron: '0 13 * * *'  # 13:00 UTC = 15:00 Libya — Afternoon Briefing
    - cron: '0 20 * * *'  # 20:00 UTC = 22:00 Libya — Night Digest
  workflow_dispatch:        # manual trigger from Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write   # needed to persist scanner state to the state/ folder

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      BREVO_API_KEY:      ${{ secrets.BREVO_API_KEY }}
      TO_EMAIL:           ${{ secrets.TO_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore persistent state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python state_sync.py download

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          echo "OLLAMA_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for Ollama to be ready
        run: |
          echo "Waiting for Ollama on localhost:11434..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama is ready"
              break
            fi
            echo "Attempt $i/30..."
            sleep 2
          done
          curl -s http://localhost:11434/api/tags || { echo "Ollama failed to start - scanner will run in fallback mode"; exit 1; }

      - name: Pull Ollama model
        run: ollama pull llama3.1:8b

      - name: Auto-discover new job sources
        run: python source_discovery.py
        continue-on-error: true

      - name: Run job scanner
        run: python scanner.py

      - name: Save persistent state
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python state_sync.py upload

      - name: Notify failure on Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}", "text": "⚠️ CareerOps scan FAILED. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Upload Excel report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: careerops-scan-${{ github.run_id }}
          path: output/*.xls
          retention-days: 30
