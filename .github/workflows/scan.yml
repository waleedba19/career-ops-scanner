name: CareerOps Job Scan

on:
  schedule:
    - cron: '0 7 * * *'    # 07:00 UTC = 09:00 Libya — Morning Delivery
    - cron: '0 16 * * *'   # 16:00 UTC = 18:00 Libya — Evening Delivery
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode (quick/standard/deep/comprehensive/adaptive)'
        required: false
        default: 'adaptive'
        type: choice
        options:
          - quick
          - standard
          - deep
          - comprehensive
          - adaptive
  push:
    branches: [main]
    paths-ignore: ['README.md', 'ARCHITECTURE.md', 'dashboard/**']

concurrency:
  group: careerops-scan-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours for comprehensive scans
    permissions:
      contents: write

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      BREVO_API_KEY:      ${{ secrets.BREVO_API_KEY }}
      TO_EMAIL:           ${{ secrets.TO_EMAIL }}
      GMAIL_USER:         ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      # Optional keyed aggregators (each fetcher is a no-op while its secret is unset).
      RAPIDAPI_KEY:       ${{ secrets.RAPIDAPI_KEY }}
      ADZUNA_APP_ID:      ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY:     ${{ secrets.ADZUNA_APP_KEY }}
      JOOBLE_API_KEY:     ${{ secrets.JOOBLE_API_KEY }}
      RELIEFWEB_APPNAME:  ${{ secrets.RELIEFWEB_APPNAME }}
      OLLAMA_MODEL:       qwen2.5:7b-instruct-q3_K_M
      # Pin the model store so the server, the CLI and the actions/cache path can
      # never diverge (a mismatch makes `ollama list` empty and 404s every call).
      OLLAMA_MODELS:      /home/runner/.ollama/models
      CAREEROPS_TIER_CAP: "2"   # balanced — verified + secondary sources
      CAREEROPS_BATCH_SIZE: "12"
      CAREEROPS_MIN_SCORE: "50" # balanced threshold — 50-74 GOOD, 75+ STRONG
      SCAN_MODE:          ${{ github.event.inputs.mode || 'adaptive' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore persistent state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python state_sync.py download

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache pip & Playwright browsers (no re-download)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: careerops-deps-v1-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # Cache the WHOLE install, not just the CLI. ollama needs its sibling
      # llama-server runner in /usr/local/lib/ollama; caching only the CLI left
      # every /api/generate returning HTTP 500 ("llama-server binary not found").
      - name: Cache Ollama install
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/ollama
            /usr/local/lib/ollama
          key: ollama-install-v2

      # Cache the pulled model too. Without this every scheduled run re-downloaded
      # ~3.8GB via `ollama pull` (no GitHub Release is published for this repo),
      # which is the single biggest cost/latency item in the scan.
      #
      # Key is versioned: actions/cache is immutable, so a snapshot taken while
      # the model was missing would be restored forever and silently disable AI.
      # The step below now verifies with `ollama list` and pulls on a miss.
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-v3

      - name: Install Ollama (skip if fully cached)
        run: |
          if command -v ollama >/dev/null 2>&1 && [ -x /usr/local/lib/ollama/llama-server ]; then
            echo "Ollama install cached"
            ollama --version
          else
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          test -x /usr/local/lib/ollama/llama-server \
            || { echo "ERROR: llama-server missing — AI scoring would 500"; exit 1; }

      # install.sh registers a systemd unit that runs as `ollama` with
      # HOME=/usr/share/ollama, so it reads models from /usr/share/ollama/...
      # That unit auto-starts and binds 11434 first, making our own
      # `ollama serve` die with "address already in use". The result was a
      # split-brain: the server read /usr/share/ollama/.ollama/models while the
      # cache and CLI used ~/.ollama/models, so a restored cache showed an EMPTY
      # `ollama list` and every /api/generate 404'd. Keep one server, one path.
      - name: Stop bundled Ollama service (avoid split model dirs)
        run: |
          sudo systemctl stop ollama 2>/dev/null || true
          sudo systemctl disable ollama 2>/dev/null || true
          # Only the root-owned systemd instance; our own server is started later
          # as the runner user, so it is untouched here.
          sudo pkill -u ollama -f "ollama serve" 2>/dev/null || true
          sleep 2
          if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
            echo "WARNING: something still holds 11434 — model dir may be split"
          else
            echo "Port 11434 is free — our runner-owned server will own the model dir"
          fi

      - name: Start Ollama server
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo "OLLAMA_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for Ollama to be ready
        run: |
          echo "Waiting for Ollama on localhost:11434..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama is ready"
              break
            fi
            echo "Attempt $i/30..."
            sleep 2
          done
          if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
            echo "Ollama verified"
            cat /tmp/ollama.log | tail -20 || true
          else
            echo "WARNING: Ollama failed — scanner will run in template fallback mode"
            cat /tmp/ollama.log | tail -50 || true
          fi

      - name: Download model from Release (permanent, no expiry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODEL_DIR="$HOME/.ollama/models"
          mkdir -p "$MODEL_DIR"

          # Presence must be checked against `ollama list`, never the filesystem.
          # A restored cache can leave ~/.ollama/models/manifests non-empty while
          # no usable model is registered. The old directory check then reported
          # "Model already present locally" and skipped the download entirely, so
          # every /api/generate returned HTTP 404 and ALL AI scoring silently
          # degraded to keyword-only mode — with the run still showing green.
          model_installed() {
            ollama list 2>/dev/null | awk 'NR>1 {print $1}' | grep -qx "$OLLAMA_MODEL"
          }

          if model_installed; then
            echo "Model $OLLAMA_MODEL is present"
            ollama list || true
            exit 0
          fi

          # Try downloading from GitHub Release (permanent storage)
          RELEASE_TAG="models-v1"
          ASSET_NAME="ollama-qwen2.5-7b.tar.gz"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"

          echo "Trying to download from release: ${RELEASE_URL}"
          if curl -fsSL -o /tmp/model.tar.gz "${RELEASE_URL}" 2>/dev/null; then
            echo "Downloaded from release — extracting..."
            tar -xzf /tmp/model.tar.gz -C "$HOME/.ollama/"
            rm -f /tmp/model.tar.gz
            echo "Model restored from release"
          fi

          # Verify the restore actually registered the model; pull if it did not.
          if ! model_installed; then
            echo "Model $OLLAMA_MODEL not registered — pulling (up to 3 attempts)"
            for i in 1 2 3; do
              ollama pull "$OLLAMA_MODEL" && break
              echo "pull attempt $i failed; retrying in 10s"
              sleep 10
            done
          fi

          ollama list || true
          if ! model_installed; then
            echo "::warning::Model $OLLAMA_MODEL is NOT installed — every AI call will return HTTP 404 and this run falls back to keyword-only scoring."
          else
            echo "Verified: $OLLAMA_MODEL is installed"
          fi

      - name: Lint — compile check (fail fast)
        run: python -m compileall -q .

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium || echo "Playwright install failed, continuing"

      - name: Probe ATS company boards (kill 404s)
        run: python company_board_probe.py
        continue-on-error: true

      - name: Install Cloudflare WARP VPN
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/install.sh | sudo bash 2>/dev/null || echo "WARP install failed — using direct IP"
          sudo warp-cli registration new 2>/dev/null || true
          sudo warp-cli mode proxy 2>/dev/null || true
          sudo warp-cli connect 2>/dev/null || echo "WARP connect failed — using direct IP"
          sleep 3
          # Test if proxy works
          if curl -s --proxy socks5://127.0.0.1:40000 --max-time 5 https://api.ipify.org 2>/dev/null; then
            echo "WARP proxy active"
            echo "WARP_PROXY=socks5://127.0.0.1:40000" >> "$GITHUB_ENV"
          else
            echo "WARP proxy not available — using direct IP"
            echo "WARP_PROXY=" >> "$GITHUB_ENV"
          fi

      - name: Run job scanner (adaptive mode)
        run: python scanner.py --mode ${{ env.SCAN_MODE }}
        env:
          HTTPS_PROXY: ${{ env.WARP_PROXY }}
          HTTP_PROXY: ${{ env.WARP_PROXY }}
          ALL_PROXY: ${{ env.WARP_PROXY }}

      - name: Export metrics & health
        if: always()
        run: |
          echo "=== health.json ==="; cat output/health.json 2>/dev/null || echo "no health"
          echo "=== metrics.json ==="; cat output/metrics.json 2>/dev/null | head -n 80 || echo "no metrics"

      - name: Save persistent state
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python state_sync.py upload

      - name: Notify failure on Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}", "text": "⚠️ CareerOps scan FAILED. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' || true

      - name: Notify scan results on Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Read the scan result JSON if it exists
          if [ -f output/health.json ]; then
            MATCHES=$(python -c "import json; d=json.load(open('output/health.json')); print(d.get('total_matches', 0))")
            ERRORS=$(python -c "import json; d=json.load(open('output/health.json')); print(d.get('total_errors', 0))")
            if [ "$ERRORS" -gt 0 ]; then
              curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                -H "Content-Type: application/json" \
                -d "{\"chat_id\": \"$TELEGRAM_CHAT_ID\", \"text\": \"Warning: CareerOps scan had $ERRORS errors. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
            fi
          fi

      - name: Upload Excel report + dashboard snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: careerops-scan-${{ github.run_id }}
          path: |
            output/*.xls
            output/*.json
            output/health.json
            output/metrics.json
          retention-days: 30

      - name: Upload dashboard as Pages artifact (optional)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: careerops-dashboard-${{ github.run_id }}
          path: dashboard/
          retention-days: 7
