name: CareerOps Job Scan

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC = 09:00 Libya — Morning Scan
    - cron: '0 16 * * *'  # 16:00 UTC = 18:00 Libya — Evening Scan
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode (quick/standard/deep/comprehensive/adaptive)'
        required: false
        default: 'adaptive'
        type: choice
        options:
          - quick
          - standard
          - deep
          - comprehensive
          - adaptive
  push:
    branches: [main]
    paths-ignore: ['README.md', 'ARCHITECTURE.md', 'dashboard/**']

concurrency:
  group: careerops-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours for comprehensive scans
    permissions:
      contents: write

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      BREVO_API_KEY:      ${{ secrets.BREVO_API_KEY }}
      TO_EMAIL:           ${{ secrets.TO_EMAIL }}
      # Optional keyed aggregators (each fetcher is a no-op while its secret is unset).
      RAPIDAPI_KEY:       ${{ secrets.RAPIDAPI_KEY }}
      ADZUNA_APP_ID:      ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY:     ${{ secrets.ADZUNA_APP_KEY }}
      JOOBLE_API_KEY:     ${{ secrets.JOOBLE_API_KEY }}
      RELIEFWEB_APPNAME:  ${{ secrets.RELIEFWEB_APPNAME }}
      OLLAMA_MODEL:       qwen2.5:3b
      CAREEROPS_TIER_CAP: "1"   # lean & fast — only verified sources
      CAREEROPS_BATCH_SIZE: "12"
      SCAN_MODE:          ${{ github.event.inputs.mode || 'adaptive' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore persistent state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python state_sync.py download

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache pip & Playwright browsers (no re-download)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: careerops-deps-v1-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen2.5-3b

      - name: Install Ollama
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi

      - name: Start Ollama server
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo "OLLAMA_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for Ollama to be ready
        run: |
          echo "Waiting for Ollama on localhost:11434..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama is ready"
              break
            fi
            echo "Attempt $i/30..."
            sleep 2
          done
          if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
            echo "Ollama verified"
            cat /tmp/ollama.log | tail -20 || true
          else
            echo "WARNING: Ollama failed — scanner will run in template fallback mode"
            cat /tmp/ollama.log | tail -50 || true
          fi

      - name: Pull Ollama model (unified)
        run: |
          if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
            ollama pull qwen2.5:3b || echo "model pull failed, continuing"
            ollama list
          else
            echo "Skipping model pull — Ollama not available"
          fi

      - name: Lint — compile check (fail fast)
        run: python -m compileall -q .

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium || echo "Playwright install failed, continuing"

      - name: Probe ATS company boards (kill 404s)
        run: python company_board_probe.py
        continue-on-error: true

      - name: Run job scanner (adaptive mode)
        run: python scanner.py --mode ${{ env.SCAN_MODE }}

      - name: Export metrics & health
        if: always()
        run: |
          echo "=== health.json ==="; cat output/health.json 2>/dev/null || echo "no health"
          echo "=== metrics.json ==="; cat output/metrics.json 2>/dev/null | head -n 80 || echo "no metrics"

      - name: Save persistent state
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python state_sync.py upload

      - name: Notify failure on Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}", "text": "⚠️ CareerOps scan FAILED. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' || true

      - name: Notify scan results on Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Read the scan result JSON if it exists
          if [ -f output/health.json ]; then
            MATCHES=$(python -c "import json; d=json.load(open('output/health.json')); print(d.get('total_matches', 0))")
            ERRORS=$(python -c "import json; d=json.load(open('output/health.json')); print(d.get('total_errors', 0))")
            if [ "$ERRORS" -gt 0 ]; then
              curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                -H "Content-Type: application/json" \
                -d "{\"chat_id\": \"$TELEGRAM_CHAT_ID\", \"text\": \"Warning: CareerOps scan had $ERRORS errors. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
            fi
          fi

      - name: Upload Excel report + dashboard snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: careerops-scan-${{ github.run_id }}
          path: |
            output/*.xls
            output/*.json
            output/health.json
            output/metrics.json
          retention-days: 30

      - name: Upload dashboard as Pages artifact (optional)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: careerops-dashboard-${{ github.run_id }}
          path: dashboard/
          retention-days: 7
