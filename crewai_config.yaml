# CareerOps 2.0 — CrewAI Configuration
# Multi-agent job search and application system using Ollama

# Ollama Configuration (NO GPT-4 — using local LLM only)
ollama_model: "qwen2.5:1.5b"
ollama_url: "http://localhost:11434"

# Agent Definitions
agents:
  researcher:
    role: "Job Researcher"
    goal: "Find Arabic translator and ESL teaching remote jobs across the web"
    backstory: >
      You are an expert job researcher specializing in finding remote Arabic
      translation and ESL teaching positions. You search DuckDuckGo, RSS feeds,
      and company career pages to discover new opportunities daily.
    tools:
      - DuckDuckGoSearchTool
      - RSSFeedTool
      - CompanyCareerScraper
    verbose: true
    
  scraper:
    role: "Job Scraper"
    goal: "Extract detailed job information from career pages and ATS systems"
    backstory: >
      You are a web scraping expert who can extract job details from any website.
      You use Playwright for JavaScript-heavy sites and simple HTTP for static pages.
      You extract title, company, location, salary, requirements, and apply URLs.
    tools:
      - PlaywrightScraperTool
      - CRWScrapeTool
      - BeautifulSoupParser
    verbose: true
    
  scorer:
    role: "Job Scorer"
    goal: "Score and rank jobs based on match with Arabic translator profile"
    backstory: >
      You are an expert job matcher who evaluates how well a job matches
      Waleed's profile: Arabic-English translator, ESL teacher, 5+ years
      experience, remote work, worldwide. You score jobs 0-100.
    tools:
      - OllamaScoringTool
      - KeywordMatchTool
      - CompanyReputationTool
    verbose: true
    
  applicant:
    role: "Application Filler"
    goal: "Fill job application forms automatically using Playwright"
    backstory: >
      You are an automation expert who fills job application forms across
      Greenhouse, Lever, Ashby, and other ATS platforms. You upload CVs
      and cover letters, fill personal details, and prepare for human review.
    tools:
      - PlaywrightFormFiller
      - GreenhouseFormTool
      - LeverFormTool
      - AshbyFormTool
    verbose: true
    
  document_writer:
    role: "Document Generator"
    goal: "Generate tailored CV and cover letter for each job application"
    backstory: >
      You are a professional document writer who creates tailored CVs and
      cover letters for each job application. You highlight relevant skills
      and experience while maintaining authenticity.
    tools:
      - OllamaWritingTool
      - PDFGeneratorTool
      - TemplateEngineTool
    verbose: true

# Task Definitions
tasks:
  search_jobs:
    description: >
      Search for Arabic translator and ESL teaching remote jobs using DuckDuckGo,
      RSS feeds (ProZ, TranslatorsCafe), and company career pages (TransPerfect,
      Lionbridge, RWS, Appen, Telus). Return list of job URLs with metadata.
    expected_output: "List of 20-50 job URLs with title, company, and source"
    agent: researcher
    
  scrape_jobs:
    description: >
      Scrape detailed job information from each URL found by the researcher.
      Extract title, company, location, salary, requirements, description,
      apply URL, and ATS platform type.
    expected_output: "List of detailed job dictionaries with all fields"
    agent: scraper
    
  score_jobs:
    description: >
      Score each job 0-100 based on match with profile:
      - Arabic translation keywords (40 points)
      - Remote work (20 points)
      - Salary above $40,000 (15 points)
      - Company reputation (15 points)
      - Easy application method (10 points)
    expected_output: "Ranked list of jobs with scores and reasons"
    agent: scorer
    
  generate_documents:
    description: >
      For top 10 jobs, generate tailored cover letter and CV.
      Highlight Arabic translation experience, legal translation,
      ESL teaching, and academic supervision.
    expected_output: "PDF cover letter and CV for each job"
    agent: document_writer
    
  fill_applications:
    description: >
      Fill job application forms for top 5 jobs using Playwright.
      Upload CV and cover letter, fill personal details, and prepare
      for human review before submission.
    expected_output: "Filled application forms ready for review"
    agent: applicant

# Workflow
workflow:
  - search_jobs
  - scrape_jobs
  - score_jobs
  - generate_documents
  - fill_applications
