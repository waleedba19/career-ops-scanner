version: "3.9"
services:
  careerops:
    build: .
    container_name: careerops-scanner
    ports:
      - "8000:8000" # dashboard
      - "8001:8001" # api
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
      - CAREEROPS_TIER_CAP=2
    volumes:
      - ./state:/app/state
      - ./output:/app/output
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: careerops-ollama
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    restart: unless-stopped

volumes:
  ollama_data:
