version: "3.9"
services:
  careerops:
    build: .
    container_name: careerops-scanner
    ports:
      - "8000:8000" # dashboard
      - "8001:8001" # api
    env_file: .env
    environment:
      - CAREEROPS_TIER_CAP=2
    volumes:
      - ./state:/app/state
      - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
